version: '3.8'
services:
  app_instance_1:
    build: .
    ports: ["8501"]
  app_instance_2:
    build: .
    ports: ["8501"]
  app_instance_3:
    build: .
    ports: ["8501"]
  nginx_load_balancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app_instance_1
      - app_instance_2
      - app_instance_3